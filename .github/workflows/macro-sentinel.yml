# 매시간 매크로 이벤트 센티널 — 새 거시 이벤트가 감지되면 리포트를 다시 만든다(하루 1회 상한, 서버가 판정)
# 필요 시크릿: CRON_SECRET (Vercel 환경변수의 CRON_SECRET와 동일 값)
name: macro-sentinel

on:
  schedule:
    - cron: '5 * * * *'   # 매시 5분 (UTC) — 정시 혼잡 회피
  workflow_dispatch:        # 수동 실행 (테스트용)

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call sentinel endpoint
        id: sentinel
        run: |
          body=$(curl -sS --fail-with-body --max-time 90 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://news.a1kor.com/api/macro-sentinel")
          echo "$body"
          echo "regenerate=$(echo "$body" | jq -r '.regenerate')" >> "$GITHUB_OUTPUT"
      - name: Regenerate report
        if: steps.sentinel.outputs.regenerate == 'true'
        run: |
          curl -sS --fail-with-body --max-time 320 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://news.a1kor.com/api/collect-daily"
