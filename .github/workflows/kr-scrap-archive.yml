# 국내 알루미늄 스크랩 주간 고시 보관 — 같은 게시글을 매주 덮어쓰므로 하루 2회 확인해 새 이미지만 저장
# 필요 시크릿: CRON_SECRET (macro-sentinel과 동일)
name: kr-scrap-archive

on:
  schedule:
    - cron: '20 0 * * *'   # 09:20 KST
    - cron: '20 9 * * *'   # 18:20 KST
  workflow_dispatch:

jobs:
  # 공개 저장소의 예약 워크플로는 60일간 활동이 없으면 GitHub가 끈다(2026-09 센티널이 이렇게 꺼졌다).
  # enable API 호출이 비활성 타이머를 초기화하므로 예약 워크플로들을 주기적으로 다시 켠다.
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in kr-scrap-archive.yml macro-sentinel.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable"
          done

  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scripts/kr-scrap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: OCR and archive
        env:
          ARCHIVE_URL: https://news.a1kor.com/api/kr-scrap-archive
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node ocr.mjs --post
