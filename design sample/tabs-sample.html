<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>탭 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>/* v3 화면 — 시안(eg 계열: 남색·주황, Pretendard). 기존 화면 CSS와 섞이지 않게 .v3 아래에만 적용한다.
   모바일 1열, 데스크탑 960px. 색은 등락(상승 빨강·하락 파랑)과 브랜드(남색·주황)를 분리한다. */
.v3 {
  --navy: #1b3668; --navy-dark: #12294b; --navy-light: #eaeff7;
  --accent: #0b7a7c; --accent-light: #e3f2f2;
  --bg: #f6f7f8; --surface: #ffffff; --surface2: #f2f4f5;
  --border: #e4e7e9; --border2: #eef0f2;
  --text: #16181d; --text2: #454b55; --text3: #6b7280; --text4: #9aa3ad;
  --up: #c0392b; --up-bg: #fdecea; --down: #1f6fb2; --down-bg: #e9f2fa;
  --flat: #6b7280; --flat-bg: #eef0f2;
  --sans: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --shadow-sm: 0 1px 2px rgba(22,24,29,.04), 0 1px 6px rgba(22,24,29,.05);
  min-height: 100dvh;
  background: var(--bg); color: var(--text); font-family: var(--sans);
  font-size: 15px; line-height: 1.65; word-break: keep-all; overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased;
}
.v3 *, .v3 *::before, .v3 *::after { box-sizing: border-box; }
.v3 .num { font-variant-numeric: tabular-nums; }
.v3 .wrap { max-width: 960px; margin: 0 auto; padding-inline: 16px; }
.v3 a { color: inherit; }

/* 헤더 */
.v3 .top { position: sticky; top: 0; z-index: 10; background: var(--surface); box-shadow: var(--shadow-sm); }
.v3 .hdr { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; border-bottom: 2px solid var(--navy); }
.v3 .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.v3 .brand img { height: 30px; width: auto; display: block; }
.v3 .brand b { font-size: 17px; font-weight: 800; color: var(--navy); letter-spacing: -.4px; white-space: nowrap; }
.v3 .brand span { font-size: 13px; color: var(--text3); white-space: nowrap; }
.v3 .date { font-size: 12.5px; font-weight: 600; color: var(--text2); white-space: nowrap; }
.v3 nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.v3 nav::-webkit-scrollbar { display: none; }
.v3 nav button { flex: 0 0 auto; padding: 11px 14px; border: 0; border-bottom: 2px solid transparent; background: none; font: 600 14.5px var(--sans); color: var(--text3); cursor: pointer; margin-bottom: -1px; white-space: nowrap; }
.v3 nav button:first-child { margin-left: auto; }
.v3 nav button:last-child { margin-right: auto; }
.v3 nav button[aria-selected="true"] { color: var(--navy); border-bottom-color: var(--accent); }
.v3 button:focus-visible, .v3 a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.v3 main { padding-block: 16px 48px; }
.v3 .panel { display: flex; flex-direction: column; gap: 14px; }
.v3 .box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.v3 .box-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 16px; background: var(--navy); color: #fff; }
.v3 .box-h h2 { margin: 0; font-size: 14px; font-weight: 700; letter-spacing: -.2px; }
.v3 .box-h small { font-size: 12px; opacity: .8; }
.v3 .lbl { font-size: 11.5px; font-weight: 700; color: var(--text3); letter-spacing: .3px; }

/* 오늘의 한 줄 */
.v3 .lead { padding: 18px 18px 16px; border-left: 4px solid var(--accent); }
.v3 .lead .lbl { color: var(--accent); }
.v3 .lead h1 { margin: 4px 0 6px; font-size: 21px; line-height: 1.4; letter-spacing: -.6px; text-wrap: balance; }
.v3 .lead p { margin: 0; color: var(--text2); font-size: 14.5px; }

.v3 .dir { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.v3 .dir.up { color: var(--up); background: var(--up-bg); }
.v3 .dir.down { color: var(--down); background: var(--down-bg); }
.v3 .dir.flat, .v3 .dir.mixed { color: var(--flat); background: var(--flat-bg); }
.v3 .qtr { display: inline-flex; flex-direction: column; align-items: flex-end; line-height: 1.3; white-space: nowrap; }
.v3 .qtr small { font-size: 11px; color: var(--text3); }
.v3 .qtr b { font-size: 14px; font-variant-numeric: tabular-nums; }

.v3 .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
.v3 .tag { font-size: 11.5px; font-weight: 600; padding: 1px 7px; border-radius: 4px; background: var(--navy-light); color: var(--navy); }

/* 시장 */
.v3 .mkt-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 16px 18px; }
.v3 .mkt-head h1 { margin: 0; font-size: 22px; letter-spacing: -.6px; }
.v3 .mkt-head .sp { flex: 1; }
.v3 .mkt-head p { flex-basis: 100%; margin: 2px 0 0; color: var(--text2); font-size: 15px; font-weight: 600; }

.v3 .nums { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 1px; background: var(--border2); border-top: 1px solid var(--border2); }
.v3 .n { background: var(--surface); padding: 12px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.v3 .n-l { font-size: 12px; font-weight: 600; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.v3 .n-v { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.v3 .n-v strong { font-size: 21px; font-weight: 800; letter-spacing: -.5px; }
.v3 .u { font-size: 12px; color: var(--text3); }
.v3 .chg { font-size: 13px; font-weight: 700; }
.v3 .chg.up { color: var(--up); } .v3 .chg.down { color: var(--down); } .v3 .chg.flat { color: var(--flat); }
.v3 .spark { width: 100%; height: 34px; display: block; }
.v3 .range { display: grid; gap: 3px; }
.v3 .range-bar { position: relative; height: 5px; border-radius: 3px; background: var(--border); }
.v3 .range-dot { position: absolute; top: 50%; width: 11px; height: 11px; margin: -5.5px 0 0 -5.5px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface); }
.v3 .range-t { display: flex; justify-content: space-between; font-size: 11px; color: var(--text3); }
.v3 .n-src { font-size: 11px; color: var(--text3); }

/* 4칸은 길이가 제각각인 글이라 여러 열로 놓으면 빈 공간이 생긴다 — 항상 한 열 흐름 */
.v3 .four { display: grid; grid-template-columns: minmax(0,1fr); gap: 14px; }
.v3 .cell { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.v3 .cell h3 { margin: 0; display: flex; align-items: center; gap: 8px; font-size: 15px; }
.v3 .cell h3 i { font-style: normal; font-size: 11.5px; font-weight: 700; color: var(--accent); letter-spacing: .3px; }
/* 이어 읽는 문단 — 숫자만 굵게 */
.v3 .para { margin: 0; font-size: 14.5px; line-height: 1.75; color: var(--text2); }
.v3 .para b { color: var(--text); font-weight: 700; font-variant-numeric: tabular-nums; }
.v3 .para .imp-a { margin-right: 5px; vertical-align: 1px; white-space: nowrap; }
.v3 .causes { display: grid; gap: 12px; }
.v3 .cause b { display: flex; align-items: center; gap: 6px; font-size: 14px; margin-bottom: 2px; }
.v3 .cause p { margin: 0; font-size: 14px; color: var(--text2); }
.v3 .krw { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 6px; margin-top: 2px; }
.v3 .krw div { background: var(--surface2); border-radius: 8px; padding: 7px 9px; display: flex; flex-direction: column; }
.v3 .krw small { font-size: 11px; color: var(--text3); }
.v3 .krw strong { font-size: 15px; }
.v3 .watch { display: grid; gap: 8px; }
.v3 .w { display: grid; grid-template-columns: 22px minmax(0,1fr); gap: 8px; font-size: 14px; }
.v3 .w b { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--navy); color: #fff; font-size: 11.5px; margin-top: 2px; }
.v3 .w p { margin: 0; color: var(--text2); }
.v3 .para.view { color: var(--text); }
.v3 .scen { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 6px; }
.v3 .scen div { border-radius: 8px; padding: 7px 10px; font-size: 13px; }
.v3 .scen .s-up { background: var(--up-bg); } .v3 .scen .s-dn { background: var(--down-bg); }
.v3 .scen b { display: block; font-size: 11.5px; }
.v3 .scen .s-up b { color: var(--up); } .v3 .scen .s-dn b { color: var(--down); }


/* 서브탭 */
.v3 .subtabs { display: flex; justify-content: center; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; align-self: center; }
.v3 .subtabs button { border: 0; background: none; padding: 7px 22px; border-radius: 7px; font: 700 14px var(--sans); color: var(--text3); cursor: pointer; }
.v3 .subtabs button[aria-selected="true"] { background: var(--navy-light); color: var(--navy); }
.v3 .sub2 button { padding: 6px 18px; font-size: 13.5px; }

/* 표 */
.v3 .tbl-wrap { overflow-x: auto; }
.v3 table { width: 100%; border-collapse: collapse; font-size: 14px; }
.v3 th { text-align: left; font-size: 12px; font-weight: 700; color: var(--text3); padding: 8px 12px; background: var(--surface2); border-bottom: 1px solid var(--border); white-space: nowrap; }
.v3 td { padding: 8px 12px; border-bottom: 1px solid var(--border2); white-space: nowrap; }
.v3 td.r, .v3 th.r { text-align: right; }
.v3 td.item { font-weight: 700; }
.v3 td.note { color: var(--text3); font-size: 12.5px; white-space: normal; min-width: 140px; }
.v3 tr.grp td { border-top: 1px solid var(--border); }
.v3 .tbl-note { padding: 10px 16px 14px; font-size: 12px; color: var(--text3); display: grid; gap: 2px; }
.v3 .calc { padding: 12px 16px; display: grid; gap: 8px; border-bottom: 1px solid var(--border2); background: var(--surface2); }
.v3 .calc-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.v3 .calc-row div { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px; }
.v3 .calc-row small { font-size: 11px; color: var(--text3); }
.v3 .calc-row b { font-size: 15px; font-variant-numeric: tabular-nums; }
.v3 .calc-row em { font-style: normal; color: var(--text4); font-weight: 700; }
.v3 .calc-row .calc-res { border-color: var(--navy); }
.v3 .calc p { margin: 0; font-size: 12.5px; color: var(--text2); }

/* 세계 동향 — 신호판은 구조가 같은 숫자 칸이라 여러 열, 사안 카드는 길이가 제각각인 글이라 항상 한 열 */
.v3 .ws-g { padding: 10px 16px 14px; border-top: 1px solid var(--border2); }
.v3 .box-h + .ws-g { border-top: 0; }
.v3 .ws-gh { font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 6px; letter-spacing: .3px; }
.v3 .ws-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.v3 .ws { background: var(--surface2); border-radius: 8px; padding: 9px 11px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.v3 .ws .n-v strong { font-size: 19px; }
.v3 .ws-c { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.v3 .ws .n-src { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.v3 .iss { gap: 10px; }
.v3 .iss-m { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
.v3 .iss-m .dir { font-size: 11.5px; padding: 1px 8px; }
.v3 .tag.mk { background: var(--accent-light); color: var(--accent); }
.v3 .iss-d { font-size: 12px; color: var(--text3); }
.v3 .iss-t { margin: 0; font-size: 17px; line-height: 1.45; letter-spacing: -.3px; }
.v3 .iss-s { display: grid; gap: 3px; padding-top: 8px; border-top: 1px dashed var(--border); }
.v3 .iss-s h4 { margin: 0; font-size: 12.5px; font-weight: 700; color: var(--navy); }
.v3 .rel { display: grid; gap: 1px; background: var(--border2); }
.v3 .rel-row { display: grid; gap: 4px; padding: 12px 16px; background: var(--surface); border: 0; text-align: left; font: inherit; color: inherit; cursor: pointer; width: 100%; }
.v3 .rel-row:hover { background: var(--surface2); }
.v3 .rel-t { font-weight: 700; font-size: 15px; line-height: 1.45; }
.v3 .rel-x { margin: 0; font-size: 13.5px; line-height: 1.65; color: var(--text2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.v3 .rel-x b { color: var(--text); }

.v3 .state { padding: 60px 16px; text-align: center; color: var(--text3); }
.v3 .foot { padding: 18px 0 8px; font-size: 12px; color: var(--text3); display: grid; gap: 4px; text-align: center; }

@media (max-width: 720px) {
  .v3 { font-size: 13.5px; line-height: 1.6; }
  .v3 .lead { padding: 14px 14px 12px; }
  .v3 .lead h1 { font-size: 17px; }
  .v3 .lead p, .v3 .mkt-head p { font-size: 13.5px; }
  .v3 .mkt-head h1 { font-size: 18px; }
  .v3 .cell { padding: 12px 14px; gap: 6px; }
  .v3 .cell h3 { font-size: 14px; }
  .v3 .cause p, .v3 .cause b, .v3 .w { font-size: 13px; }
  .v3 .para { font-size: 13.5px; line-height: 1.7; }
  .v3 .scen div { font-size: 12.5px; }
  .v3 .ws-grid { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 6px; }
  .v3 .ws-g { padding: 8px 12px 12px; }
  .v3 .ws .n-v strong { font-size: 16px; }
  .v3 .iss-t { font-size: 15.5px; }
  .v3 .rel-row { padding: 10px 14px; }
  .v3 .rel-t { font-size: 14px; }
  .v3 .rel-x { font-size: 13px; }
  .v3 .n { padding: 10px 14px; }
  .v3 .n-v strong { font-size: 18px; }
  .v3 table { font-size: 13px; }
  .v3 .brand span { display: none; }
  /* 탭 6개가 360px 폭에서도 한 줄에 다 보이게(가로 스크롤에 마지막 탭이 숨지 않게) */
  .v3 nav { gap: 0; }
  .v3 nav button { flex: 1 1 auto; padding: 10px 2px; font-size: 12.5px; letter-spacing: -.3px; }
  .v3 nav button:first-child, .v3 nav button:last-child { margin-inline: 0; }
}
@media (prefers-reduced-motion: no-preference) { .v3 nav button { transition: color .15s, border-color .15s; } }

/* ─── 브리핑(뉴스레터풍, 2026-11-17 시안 승인) ───────────────────────────────
   흰 지면 한 장 위에 섹션을 이어 둔다. 여러 열(숫자·카드)은 높이 고정, 글이 긴 칸(흐름)은 한 열 */
.v3 .nl { gap: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; padding-bottom: 28px; }
.v3 .nl button { font: inherit; color: inherit; text-align: left; border: 0; background: none; cursor: pointer; padding: 0; }

.v3 .nl-hero { position: relative; min-height: 210px; display: flex; align-items: center; color: #fff; overflow: hidden; }
.v3 .nl-hero-t { position: relative; z-index: 2; padding: 24px 30px; max-width: 62%; }
.v3 .nl-kick { font-size: 12px; font-weight: 700; letter-spacing: .16em; opacity: .8; }
.v3 .nl-hero h1 { margin: 8px 0 0; font-size: 32px; line-height: 1.25; font-weight: 800; letter-spacing: -.03em; text-wrap: balance; }
.v3 .nl-hero-d { margin-top: 12px; font-size: 15px; font-weight: 600; opacity: .9; }
.v3 .nl-hero-art { position: absolute; right: 0; bottom: 0; height: 100%; z-index: 1; }
.v3 .nl-hero-art svg { height: 100%; width: auto; display: block; }

.v3 .nl .nl-ins { position: relative; display: block; width: 100%; text-align: center; padding: 32px 96px 30px; border-bottom: 1px solid var(--border2); }
.v3 .nl-tag { color: var(--navy); font-size: 12px; font-weight: 700; letter-spacing: .14em; }
.v3 .nl-ins h2 { margin: 10px 0 12px; font-size: 23px; font-weight: 800; letter-spacing: -.03em; line-height: 1.38; }
.v3 .nl-ins .para { color: var(--text3); }
.v3 .nl-go { position: absolute; right: 0; top: 50%; transform: translateY(-50%); width: 62px; height: 92px; border-radius: 46px 0 0 46px; background: #2f63b8; color: #fff; font-size: 11px; font-weight: 700; letter-spacing: .06em; line-height: 1.3; display: flex; flex-direction: column; justify-content: center; padding-left: 15px; text-align: left; }
.v3 .nl-go em { font-style: normal; font-size: 17px; margin-top: 3px; }

.v3 .nl-sec { padding: 0 28px; }
.v3 .nl-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin: 26px 0 12px; }
.v3 .nl-h b { font-size: 17px; font-weight: 800; letter-spacing: -.02em; }
.v3 .nl-h small { font-size: 12px; color: var(--text4); white-space: nowrap; }

.v3 .nl-tiles { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
.v3 .nl .nl-tile { border: 1px solid var(--border); border-radius: 12px; padding: 11px 14px 9px; height: 112px; display: flex; flex-direction: column; min-width: 0; }
.v3 .nl button.nl-tile:hover { border-color: var(--navy); }
.v3 .nl-k { font-size: 12px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.v3 .nl-v { font-size: 22px; font-weight: 800; letter-spacing: -.02em; margin-top: 2px; line-height: 1.3; white-space: nowrap; }
.v3 .nl-v small { font-size: 12px; font-weight: 600; color: var(--text3); margin-left: 4px; letter-spacing: 0; }
.v3 .nl-tile .spark { height: 24px; margin-top: auto; }

/* 띠는 높이 고정(시안 150px에서 낮춤 — 사용자 요청). 그림 자리는 글과 겹치지 않게 비워 둔다 */
.v3 .nl-bands { display: grid; gap: 10px; }
.v3 .nl .nl-band { position: relative; display: grid; grid-template-columns: 136px 1px minmax(0,1fr); align-items: center; height: 100px; padding-right: 150px; overflow: hidden; color: #fff; border-radius: 4px; }
.v3 .nl .nl-band:hover { filter: brightness(1.06); }
.v3 .nl-band-n { padding-left: 24px; position: relative; z-index: 2; }
.v3 .nl-band-n b { display: block; font-size: 19px; font-weight: 800; letter-spacing: -.03em; line-height: 1.25; }
.v3 .nl-chip { display: inline-block; margin-top: 6px; font-size: 11.5px; font-weight: 700; padding: 2px 9px; border-radius: 20px; background: rgba(255,255,255,.94); }
.v3 .nl-chip.up { color: var(--up); } .v3 .nl-chip.down { color: var(--down); } .v3 .nl-chip.flat, .v3 .nl-chip.mixed { color: var(--flat); }
.v3 .nl-band-bar { width: 1px; height: 60px; background: rgba(255,255,255,.45); }
.v3 .nl-band-m { position: relative; z-index: 2; margin: 0; padding-left: 20px; font-size: 15px; line-height: 1.5; font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.v3 .nl-band-art { position: absolute; right: 0; top: 0; height: 100%; z-index: 1; }
.v3 .nl-band-art svg { height: 100%; width: auto; display: block; }

.v3 .nl-lead { margin-bottom: 14px; }
.v3 .nl-factors { display: grid; border-top: 1px solid var(--border2); }
.v3 .nl-factor { padding: 12px 0; border-bottom: 1px solid var(--border2); display: grid; gap: 4px; }
.v3 .nl-factor h3 { margin: 0; font-size: 15px; }

.v3 .nl-cards { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 22px 18px; }
.v3 .nl .nl-card { display: block; min-width: 0; }
.v3 .nl-thumb { position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 16 / 9; border: 1px solid var(--border); }
.v3 .nl-thumb > div, .v3 .nl-thumb svg { width: 100%; height: 100%; display: block; }
.v3 .nl-eff { position: absolute; left: 10px; top: 10px; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 20px; background: #fff; }

l Taweelah 시설을 긴급 정지한 뒤 생산과 판매에 큰 영향을 받았다.","EGA는 환원 셀을 단계적으로 재가동하고 있으며, 보고일 기준 재가동 대상 1,262개 셀 중 766개를 재가동했고 2027년 1분기에 재가동 프로그램을 완료할 예정이다."],"relation":"셀 재가동에 따라 알루미늄 금속 생산과 수출 물량이 회복되는 경로이다.","reach":"복구가 진행되면 중동산 알루미늄의 가용 물량이 늘어 한국 수입 가격과 조달선에도 영향을 줄 전망이다.","outlook":"EGA가 2027년 1분기에 복구 프로그램을 마치고 생산을 늘릴 전망이어서, 이후 알루미늄 공급 압박은 점차 완화될 것으로 보인다.","first_seen":"2026-11-17"},{"title":"이탈리아 Beltrame, 에너지 비용에 감산","region":"이탈리아","category":"supply","effect":"up","scale":"medium","markets":["steel"],"uses":"건설용 장강류, 철근, 전기로 제강","published":"2026-11-17","what":["AFV Beltrame Group 부회장 Barbara Beltrame Giacomello는 에너지 요금이 생산 시점과 규모를 결정하고 있으며, 계획된 가동 중단이 이 불균형에서 직접 비롯됐다고 밝혔다.","11월 9일 이탈리아 전력가격은 EUR311/MWh에 도달했으며, 연속 공정인 Beltrame의 생산 방식은 시간대별 전력가격에 맞춰 몇 시간씩 가동을 줄이는 방식이 어렵다.","Federacciai는 높은 전력·가스 비용 때문에 이탈리아 제철소들이 가동을 중단하고 있으며, 생산을 계속하면 감당하기 어려운 비용이 쌓이고 유럽 경쟁업체 대비 경쟁력이 떨어진다고 밝혔다."],"relation":"장강 생산은 연속 공정이어서 전력가격이 높아지면 단시간 감산보다 설비 가동 중단으로 이어질 수 있다. 이는 건설용 철근 등 장강류 공급을 줄이고 유럽 제철소의 원료 소비에도 영향을 준다.","reach":"영향은 이탈리아 장강류 공급과 유럽 역내 철강 수급에 우선 나타날 수 있다. 유럽산 철강의 가용 물량과 경쟁 여건을 통해 한국 제강사의 직접 원료보다는 글로벌 철강 가격과 수출 흐름에 간접적으로 닿을 것으로 보인다.","outlook":"이탈리아의 높은 전력·가스 비용이 이어지면 장강 생산 중단이 지속되고 유럽 철강 생산능력의 축소 압력이 커질 전망이다.","first_seen":"2026-11-17"},{"title":"Ferroglobe, 남아공 페로실리콘로 폐쇄","region":"남아공 음푸말랑가","category":"supply","effect":"up","scale":"medium","markets":["ferro"],"uses":"전기로 제강, 스테인리스 생산","published":"2026-11-13","what":["Ferroglobe는 현지 철강사의 수요가 약해 재가동 위험이 크다고 판단해 남아공 음푸말랑가의 eMalahleni 페로실리콘 제련로를 11월 말까지 일시 폐쇄하기로 했다.","Ferroglobe 남아공 지역 책임자 Nellis Bester는 현지 철강·스테인리스 수요의 불확실성이 재가동의 주요 장애물이라고 밝혔고, 전력 사용 여부와 관계없이 보장 물량을 지급해야 하는 계약 조건도 부담으로 작용했다.","이번 폐쇄는 높은 전력요금과 철도 비효율, 항만 혼잡에 시달리는 남아공 제련업계의 압박을 반영하며, 페로실리콘과 망간 합금 생산업체는 전력비와 부진한 철강 수요로 수익성 압박을 받고 있다."],"relation":"페로실리콘은 전기로 제강과 스테인리스 생산에서 탈산·합금 원료로 사용된다. 제련로 폐쇄는 해당 지역의 공급을 줄이고 다른 산지와의 대체 조달 수요를 늘릴 수 있다.","reach":"영향은 남아공 페로실리콘 생산과 현지 철강사에 먼저 나타나고, 공급 감소가 수출 물량과 국제 합금철 수급으로 확산될 수 있다. 한국 제강사의 조달에는 남아공산 대체 가능 물량과 국제 페로실리콘 가격을 통한 간접         <div class="mt-src">${md(s.date)} \xB7 1\uC77C ${pct(s.d1_pct)} \xB7 1\uAC1C\uC6D4 ${pct(s.m1_pct)}</div>
      </div>`;
    }).join("")}</div>
  </div>

  <article class="nl-sec art">
    <div class="ar"><div class="ar-l"><i>\uC9C0\uAE08</i>\uC5B4\uB5BB\uAC8C \uB3CC\uC544\uAC00\uB098</div><p class="para">${bold(m.now.join(" "))}</p></div>
    ${m.why.length ? `<div class="ar"><div class="ar-l"><i>\uC65C</i>\uC6D0\uC778</div>${m.why.map((w) => `<div class="cz"><span class="cz-rg">\u3010${esc(w.region)}\u3011</span><b>${esc(w.title)}</b><p class="para">${bold(w.text)}</p></div>`).join("")}</div>` : ""}
    <div class="ar"><div class="ar-l"><i>\uC601\uD5A5</i>${steel ? "\uC5B4\uB5A4 \uC6D0\uC790\uC7AC \uC218\uC694\uC5D0" : "\uC5B4\uB514\uC5D0, \uC5B4\uB5BB\uAC8C"}</div>
      <p class="para">${m.impact.map((x) => `<span class="tag">${esc(x.area)}</span> ${bold(x.text)}`).join(" ")}</p>
      ${m.metrics.krw ? `<div class="krw">${[["\uB2EC\uB7EC \uAC00\uACA9 (\uC8FC\uAC04)", m.metrics.krw.price_pct], ["\uD658\uC728 \uD6A8\uACFC", m.metrics.krw.fx_pct], ["\uC6D0\uD654 \uAD6C\uB9E4\uAC00", m.metrics.krw.krw_pct]].map(([l, v]) => `<div><small>${l}</small><b class="${cls(v)}">${pct(v)}</b></div>`).join("")}</div>` : ""}
    </div>
    <div class="ar"><div class="ar-l"><i>\uC804\uB9DD</i>1~2\uC8FC</div>
      ${m.outlook.view ? `<p class="para view">${bold(m.outlook.view)}</p>` : ""}
      <ol class="wt">${m.outlook.watch.map((w) => `<li>${esc(w)}</li>`).join("")}</ol>
      <div class="scen">${m.outlook.up ? `<div class="s-up"><b>\u25B2 \uC0C1\uBC29</b>${esc(m.outlook.up)}</div>` : ""}${m.outlook.down ? `<div class="s-dn"><b>\u25BC \uD558\uBC29</b>${esc(m.outlook.down)}</div>` : ""}</div>
    </div>
  </article>

  ${rel.length ? `<div class="nl-sec">${sec("\uC774 \uD488\uBAA9\uC5D0 \uB2FF\uB294 \uC138\uACC4 \uB3D9\uD5A5", "\uB20C\uB7EC\uC11C \uC804\uCCB4 \uBCF4\uAE30")}${cards(rel)}</div>` : ""}`;
  }
  function worldTab() {
    const w = R.world, h = heroArt("2026-11-20");
    const seen = {};
    return `
  <section class="tb" style="background:${h.bg}">
    <div class="tb-t"><div class="nl-kick">WORLD</div><h1>\uD488\uBAA9\uC744 \uC6C0\uC9C1\uC774\uB294 \uC138\uACC4\uC758 \uC77C</h1><div class="tb-d">${md(w.issues_date)} \uAE30\uC900 \xB7 \uC0AC\uC548 ${w.issues.length}\uAC74</div></div>
    <div class="tb-art">${h.svg}</div>
  </section>
  <div class="nl-sec">${sec("\uC218\uC694\xB7\uACF5\uAE09 \uC2E0\uD638", "\uACF5\uC2DD \uD1B5\uACC4")}
    ${GROUPS.map(([g, name]) => {
      const it = w.signals.filter((s) => s.group === g);
      return it.length ? `
      <div class="sg-h">${SIGNAL_ICON[g] ?? ""}<b>${name}</b></div>
      <div class="sg">${it.map((s) => {
        const p = s.yoy != null ? s.yoy : s.prev ? +((s.value - s.prev) / s.prev * 100).toFixed(2) : null;
        return `
        <div class="sg-t"><div class="nl-k">${esc(s.label)}</div><div class="sg-v">${fmt(s.value)}<small>${esc(s.unit)}</small></div>
        <div class="sg-c">${p != null ? `<span class="chg ${cls(p)}">${pct(p)}</span> ${s.yoy != null ? "\uC804\uB144 \uAC19\uC740 \uB2EC \uB300\uBE44" : `${esc(s.prev_label)} \uB300\uBE44`}` : ""}</div>
        <div class="mt-src">${esc(s.when)} \xB7 ${esc(s.desc)}</div></div>`;
      }).join("")}</div>` : "";
    }).join("")}
  </div>
  <div class="nl-sec">${sec("\uC0AC\uC548", "\uCD5C\uADFC 2\uC8FC \xB7 \uC6D0\uBB38 \uB300\uC870\uB97C \uD1B5\uACFC\uD55C \uAC83\uB9CC")}
    ${w.issues.map((x) => {
      const nth = seen[x.category] = (seen[x.category] ?? -1) + 1, e = EFF[x.effect];
      return `
    <article class="is">
      <div class="is-h">
        <div class="is-th">${thumbArt(x.category, BAND_COLOR[x.markets[0]] ?? BAND_COLOR.steel, nth)}</div>
        <div>
          <div class="is-m"><span class="tag">${CAT[x.category]}</span>${x.markets.map((k) => `<span class="tag mk">${MK[k]}</span>`).join("")}${e ? `<span class="nl-eff ${e[0]}">${e[1]}</span>` : ""}</div>
          <span class="nl-rg l">\u3010${esc(x.region)}\u3011</span><h2>${esc(x.title)}</h2>
          <div class="is-d">${SCALE[x.scale]} \xB7 ${md(x.published)} \uBC1C\uD45C</div>
        </div>
      </div>
      <p class="para">${bold(x.what.join(" "))}</p>
      ${[[x.uses ? `\uD488\uBAA9\uACFC\uC758 \uAD00\uACC4 \xB7 ${x.uses}` : "\uD488\uBAA9\uACFC\uC758 \uAD00\uACC4", x.relation], ["\uC601\uD5A5 \uBC94\uC704", x.reach], ["\uC55E\uC73C\uB85C \uC608\uC0C1", x.outlook]].filter(([, t]) => t).map(([l, t]) => `<div class="is-s"><h4>${esc(l)}</h4><p class="para">${bold(t)}</p></div>`).join("")}
    </article>`;
    }).join("")}
  </div>`;
  }
  var TABS = [["brief", "\uBE0C\uB9AC\uD551"], ["world", "\uC138\uACC4 \uB3D9\uD5A5"], ["ferro", "\uD569\uAE08\uCCA0"], ["al1", "\uC54C\uB8E8\uBBF8\uB284"], ["recarb", "\uAC00\uD0C4\uC81C"], ["steel", "\uCCA0\uAC15 \uC5C5\uD669"]];
  function render() {
    const tab = location.hash.slice(1) || "ferro";
    document.getElementById("nav").innerHTML = TABS.map(([id2, t]) => `<a href="#${id2}" class="${id2 === tab ? "on" : ""}${id2 === "brief" ? " off" : ""}">${t}</a>`).join("");
    document.getElementById("sheet").innerHTML = tab === "world" ? worldTab() : R.markets[tab] ? marketTab(tab) : marketTab("ferro");
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", render);
  render();
})();
</script></body></html>
