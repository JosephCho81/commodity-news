<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>원자재 브리핑 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--navy:#1b3561;--ink:#1a1d24;--sub:#6b7280;--mute:#8a8f98;--line:#e6e8ec;--up:#d6453d;--down:#2f6fdc;--flat:#7b818c}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#eef0f3;color:var(--ink);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}
.wrap{max-width:760px;margin:0 auto;background:#fff;border-top:6px solid var(--navy);padding-bottom:40px}

header{display:flex;justify-content:space-between;align-items:flex-end;padding:22px 28px 18px}
.logo{display:flex;align-items:center;gap:10px}
.logo b{font-size:20px;letter-spacing:-.02em;display:block}
.logo small{display:block;font-size:10px;color:var(--sub);letter-spacing:.06em;margin-top:1px}
.issue{text-align:right}
.issue .no{font-size:12px;color:var(--navy);font-weight:700}
.issue .t{font-size:18px;font-weight:700;color:#2b2f36;margin-top:2px}
.issue .d{font-size:11px;letter-spacing:.14em;color:var(--sub);margin-top:4px}

nav{display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
nav a{flex:1 1 auto;text-align:center;padding:11px 0;font-size:13px;color:#555;text-decoration:none;white-space:nowrap}
nav a.on{color:var(--navy);font-weight:700;box-shadow:inset 0 -2px 0 var(--navy)}

.hero{position:relative;height:230px;overflow:hidden;color:#fff;display:flex;align-items:center;transition:background .4s}
.hero .txt{position:relative;z-index:2;padding:0 32px}
.hero .kick{font-size:12px;font-weight:700;letter-spacing:.16em;opacity:.8}
.hero h1{font-size:34px;line-height:1.22;font-weight:800;letter-spacing:-.03em;margin-top:10px}
.hero .date{margin-top:14px;font-size:15px;font-weight:600;opacity:.9}
.hero .art{position:absolute;right:0;bottom:0;height:100%;z-index:1}
.hero .art svg{height:100%;width:auto;display:block}

.insight{text-align:center;padding:36px 64px 34px;position:relative}
.tag{color:var(--navy);font-size:12px;font-weight:700;letter-spacing:.14em}
.insight h2{font-size:24px;font-weight:800;letter-spacing:-.03em;margin:12px 0 14px;line-height:1.35}
.insight p{color:var(--mute);font-size:14.5px;line-height:1.7}
.go{position:absolute;right:0;top:50%;transform:translateY(-50%);width:62px;height:96px;border-radius:48px 0 0 48px;background:#2f63b8;color:#fff;font-size:11px;font-weight:700;letter-spacing:.06em;display:flex;flex-direction:column;justify-content:center;padding-left:16px;line-height:1.3;text-decoration:none}
.go span{font-size:18px;margin-top:4px}

.sec{padding:8px 28px 0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 12px}
.sec-h b{font-size:17px;font-weight:800;letter-spacing:-.02em}
.sec-h small{font-size:12px;color:var(--mute)}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{border:1px solid var(--line);border-radius:12px;padding:12px 14px 10px;height:112px;display:flex;flex-direction:column}
.tile .k{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.tile .c{font-size:12.5px;font-weight:700;margin-top:1px}
.tile svg{margin-top:auto;width:100%;height:24px;display:block}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--flat)}

.bands{padding:0 28px}
.band{position:relative;display:flex;align-items:center;height:150px;margin-bottom:16px;overflow:hidden;color:#fff;text-decoration:none}
.band .name{width:30%;padding-left:30px;flex-shrink:0;position:relative;z-index:2}
.band .name b{display:block;font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1.25;text-shadow:0 1px 2px rgba(0,0,0,.12)}
.chip{display:inline-block;margin-top:8px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;background:rgba(255,255,255,.92)}
.band .bar{width:1px;height:86px;background:rgba(255,255,255,.45);flex-shrink:0;position:relative;z-index:2}
.band .msg{position:relative;z-index:2;padding-left:22px;max-width:38%}
.band .msg p{font-size:15px;line-height:1.5;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.arrow{display:inline-flex;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.28);align-items:center;justify-content:center;margin-top:12px;font-size:16px}
.band .art{position:absolute;right:0;top:0;height:100%;z-index:1}
.band .art svg{height:100%;width:auto;display:block}

.cards{display:grid;grid-template-columns:1fr 1fr;gap:22px 20px;padding:0 28px}
.card{text-decoration:none;color:inherit}
.thumb{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:16/9;border:1px solid var(--line)}
.thumb svg{width:100%;height:100%;display:block}
.thumb .eff{position:absolute;left:10px;top:10px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;background:#fff}
.card h3{text-align:center;font-size:15.5px;font-weight:700;line-height:1.45;letter-spacing:-.02em;margin-top:12px;height:2.9em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .rg{display:block;text-align:center;font-size:12.5px;color:var(--navy);font-weight:700;margin-top:12px}
.card .rg + h3{margin-top:2px}

.foot{display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:36px 28px 0;padding:24px 0}
.sig{display:flex;gap:14px;flex:1.1;padding-right:20px;border-right:1px solid var(--line)}
.sig > div{flex:1;text-align:center}
.ico{width:64px;height:64px;margin:0 auto;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.08);border:1px solid #eef0f3;display:flex;align-items:center;justify-content:center}
.sig b{display:block;font-size:13.5px;margin-top:10px}
.sig .sv{font-size:15px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
.sig small{display:block;font-size:11px;color:var(--mute);margin-top:3px;line-height:1.4}
.cal{flex:1;padding-left:24px}
.cal > b{font-size:14px;display:block;margin-bottom:10px}
.cal .when{color:#3d6fc4;font-size:16px;font-weight:700;margin-top:10px}
.cal .what{font-size:13.5px;color:#333;margin-top:2px;line-height:1.45}
.note{text-align:center;font-size:12px;color:var(--mute);margin-top:26px}

.demo{position:fixed;right:16px;bottom:16px;z-index:9;background:#111827;color:#fff;border:0;border-radius:24px;padding:10px 16px;font:600 13px Pretendard,sans-serif;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}

@media (max-width:560px){
  header{padding:16px 16px 14px}
  .logo b{font-size:17px}.issue .t{font-size:15px}
  nav a{font-size:12px}
  .hero{height:180px}
  .hero .txt{padding:0 18px}
  .hero h1{font-size:22px}
  .hero .date{font-size:13px;margin-top:10px}
  .hero .art{right:-30px;height:80%}
  .insight{padding:28px 60px 28px 18px;text-align:left}
  .insight h2{font-size:19px}
  .insight p{font-size:13.5px}
  .go{width:46px;height:78px;padding-left:10px;font-size:9.5px}
  .sec{padding:4px 16px 0}
  .tiles{grid-template-columns:1fr 1fr;gap:8px}
  .tile{height:104px;padding:10px 12px 8px}
  .tile .v{font-size:19px}
  .bands,.cards{padding:0 16px}
  .band{height:128px;margin-bottom:12px}
  .band .name{width:31%;padding-left:16px}
  .band .name b{font-size:16px}
  .band .msg{padding-left:12px;max-width:47%}
  .band .msg p{font-size:13px}
  .arrow{width:26px;height:26px;margin-top:8px;font-size:14px}
  .band .art{right:-50px;opacity:.9}
  .cards{gap:18px 12px}
  .card h3{font-size:13.5px}
  .card .rg{font-size:11.5px}
  .foot{flex-direction:column;margin:28px 16px 0}
  .sig{border-right:0;padding-right:0;padding-bottom:20px;border-bottom:1px solid var(--line);gap:6px}
  .cal{padding:18px 0 0}
}
</style>
</head>

  <p class="note">매일 아침 업데이트</p>
</div>
<button class="demo" id="demo">다른 날 그림 보기 (시안)</button>

function snow(n, w, h, seed) {
  let s = seed, out = '';
  const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  for (let i = 0; i < n; i++) out += `<circle cx="${(rnd() * w).toFixed(0)}" cy="${(rnd() * h * .8).toFixed(0)}" r="${(1 + rnd() * 2.2).toFixed(1)}" fill="#fff" opacity="${(.35 + rnd() * .5).toFixed(2)}"/>`;
  return out;
}
function downCard(x, y, color) {
  return `<g transform="rotate(-6 ${x + 31} ${y + 22})"><rect x="${x}" y="${y}" width="62" height="44" rx="8" fill="#fff" opacity=".96"/>
  <polyline points="${x + 9},${y + 13} ${x + 20},${y + 19} ${x + 30},${y + 16} ${x + 42},${y + 29} ${x + 52},${y + 34}" stroke="${color}" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M${x + 55} ${y + 36} l-9 -1 l5 -7z" fill="${color}"/></g>`;
}

    () => { const a = id(), b = id(); return `<svg viewBox="0 0 360 220" preserveAspectRatio="xMaxYMax meet"><defs>
      <radialGradient id="${a}" cx=".4" cy=".35"><stop offset="0" stop-color="#eef1f6"/><stop offset=".7" stop-color="#a8b1c0"/><stop offset="1" stop-color="#7c8596"/></radialGradient>
      <linearGradient id="${b}" x1="0" x2="1"><stop offset="0" stop-color="#8d96a6"/><stop offset="1" stop-color="#c9cfd9"/></linearGradient></defs>

const BAND_ART = {
  ferro: () => { const a = id(); const lump = (pts, f) => `<path d="${pts}" fill="${f || `url(#${a})`}" stroke="#5c6270" stroke-width=".8"/>`; return `<svg viewBox="0 0 220 150" preserveAspectRatio="xMaxYMid meet"><defs>
    <linearGradient id="${a}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1f3f7"/><stop offset=".55" stop-color="#b4bac6"/><stop offset="1" stop-color="#7e8594"/></linearGradient></defs>
    <ellipse cx="130" cy="132" rx="80" ry="8" fill="#000" opacity=".18"/>
    ${lump('M70 128 l10 -26 l24 -6 l14 18 l-6 16z')}${lump('M108 130 l6 -30 l22 -10 l20 14 l-2 26z')}${lump('M150 130 l4 -22 l24 -8 l14 16 l-4 14z')}
    ${lump('M92 104 l12 -22 l22 2 l6 18 l-18 10z')}${lump('M134 98 l10 -20 l20 0 l8 16 l-14 12z')}${lump('M114 80 l12 -16 l18 4 l2 14 l-16 6z')}
    <path d="M118 88 l8 -6 M142 84 l6 -4 M84 112 l10 -6" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".8"/>
    <g transform="rotate(5 186 36)"><rect x="160" y="16" width="52" height="38" rx="7" fill="#fff"/><polyline points="167,44 178,38 188,40 199,27 205,24" stroke="#d6453d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M207 22 l-8 1 l4 6z" fill="#d6453d"/></g>
  </svg>`; },
  al1: () => { const t = id(), f = id(), s = id();
    const ingot = (x, y) => `<path d="M${x} ${y} h48 l10 -9 h-48z" fill="url(#${t})"/><path d="M${x - 3} ${y + 15} h54 l-3 -15 h-48z" fill="url(#${f})"/><path d="M${x + 48} ${y} l10 -9 l2 14 l-11 10z" fill="url(#${s})"/>`;
    return `<svg viewBox="0 0 220 150" preserveAspectRatio="xMaxYMid meet"><defs>
    <linearGradient id="${t}" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d7dde7"/></linearGradient>
    <linearGradient id="${f}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c5ccd8"/><stop offset="1" stop-color="#959eae"/></linearGradient>
    <linearGradient id="${s}"><stop offset="0" stop-color="#a7afbd"/><stop offset="1" stop-color="#7d8697"/></linearGradient></defs>
    <ellipse cx="130" cy="134" rx="86" ry="8" fill="#000" opacity=".18"/>
    ${ingot(56, 112)}${ingot(110, 112)}${ingot(164, 112)}${ingot(83, 88)}${ingot(137, 88)}${ingot(110, 64)}
  </svg>`; },
  al2: () => { const a = id(), b = id(); return `<svg viewBox="0 0 220 150" preserveAspectRatio="xMaxYMid meet"><defs>
    <radialGradient id="${a}" cx=".4" cy=".35"><stop offset="0" stop-color="#f4f6f9"/><stop offset="1" stop-color="#9aa3b2"/></radialGradient>
    <linearGradient id="${b}" x1="0" x2="1"><stop offset="0" stop-color="#e2e6ec"/><stop offset="1" stop-color="#9ca5b4"/></linearGradient></defs>
    <ellipse cx="140" cy="136" rx="78" ry="7" fill="#000" opacity=".18"/>
    <circle cx="150" cy="78" r="54" fill="url(#${a})" stroke="#7d8697" stroke-width="2"/><circle cx="150" cy="78" r="42" fill="#5f6878"/>
    ${[0,72,144,216,288].map(r => `<path d="M146 76 L142 40 Q150 34 158 40 L154 76z" fill="url(#${b})" transform="rotate(${r} 150 78)"/>`).join('')}
    <circle cx="150" cy="78" r="12" fill="url(#${b})" stroke="#7d8697"/><circle cx="150" cy="78" r="4" fill="#5f6878"/>
    <g transform="rotate(-18 78 118)"><path d="M62 104 h28 l-2 10 l4 6 l-3 14 h-26 l2 -12 l-4 -6z" fill="url(#${b})" stroke="#7d8697"/><rect x="64" y="112" width="26" height="6" fill="#d6453d" opacity=".8"/></g>
  </svg>`; },
  recarb: () => { const a = id(); let g = '', s = 5;
    const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
    for (let i = 0; i < 90; i++) { const x = 70 + rnd() * 110, top = 132 - 30 * Math.sin(((x - 70) / 110) * Math.PI); const y = top + rnd() * (134 - top); g += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(1.6 + rnd() * 2).toFixed(1)}" fill="${rnd() > .7 ? '#5b5f6b' : '#1c1e24'}"/>`; }
    return `<svg viewBox="0 0 220 150" preserveAspectRatio="xMaxYMid meet"><defs>
    <linearGradient id="${a}" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d8dbe2"/></linearGradient></defs>
    <ellipse cx="140" cy="136" rx="80" ry="7" fill="#000" opacity=".2"/>
    <path d="M128 30 h64 l6 98 h-76z" fill="url(#${a})"/><path d="M132 30 q6 -16 12 0 M176 30 q6 -16 12 0" stroke="#e8eaef" stroke-width="4" fill="none"/>
    <rect x="126" y="62" width="70" height="20" fill="#2f3441" opacity=".85"/><rect x="134" y="69" width="40" height="5" rx="2" fill="#fff" opacity=".8"/>
    ${g}
  </svg>`; },
  steel: () => { const a = id(); let rods = '';
    const pos = [[0,0],[1,0],[2,0],[3,0],[.5,1],[1.5,1],[2.5,1],[1,2],[2,2]];
    pos.forEach(([c, r]) => { const x = 104 + c * 26, y = 116 - r * 23; rods += `<circle cx="${x}" cy="${y}" r="12" fill="url(#${a})" stroke="#6b3418" stroke-width="1.2"/><circle cx="${x}" cy="${y}" r="5" fill="none" stroke="#6b3418" stroke-width=".8" opacity=".6"/>`; });
    return `<svg viewBox="0 0 220 150" preserveAspectRatio="xMaxYMid meet"><defs>
    <radialGradient id="${a}" cx=".35" cy=".35"><stop offset="0" stop-color="#f0a46e"/><stop offset="1" stop-color="#a24f25"/></radialGradient></defs>
    <ellipse cx="146" cy="134" rx="72" ry="7" fill="#000" opacity=".2"/>
    ${rods}<path d="M90 120 Q140 136 196 120" stroke="#2a2d35" stroke-width="4" fill="none"/>
  </svg>`; }
};

const THUMB = {
  demand: (c) => `<rect width="160" height="90" fill="${c}" opacity=".16"/><rect x="104" y="14" width="6" height="64" fill="#e3a72c"/><rect x="58" y="16" width="80" height="5" fill="#e3a72c"/><line x1="72" y1="21" x2="72" y2="48" stroke="#333" stroke-width="1.2"/><rect x="58" y="48" width="30" height="4" rx="2" fill="#a24f25"/><rect x="58" y="53" width="30" height="4" rx="2" fill="#b65e30"/><rect x="0" y="78" width="160" height="12" fill="${c}" opacity=".3"/>`,
  supply: (c) => `<rect width="160" height="90" fill="${c}" opacity=".16"/><path d="M40 78 V48 l18 -12 v12 l18 -12 v12 l18 -12 v42z" fill="${c}" opacity=".75"/><rect x="100" y="22" width="10" height="56" fill="${c}" opacity=".85"/><circle cx="105" cy="16" r="5" fill="${c}" opacity=".25"/><circle cx="112" cy="9" r="4" fill="${c}" opacity=".18"/><rect x="0" y="78" width="160" height="12" fill="${c}" opacity=".3"/>`
};
const EFFECT = { up: ['가격 상방 요인', 'up'], down: ['가격 하방 요인', 'down'], unclear: ['방향 불확실', 'flat'] };
const DIR = { up: ['강세', 'up'], down: ['약세', 'down'], flat: ['보합', 'flat'] };
const ICON = {
  mill: '<svg width="34" height="34" viewBox="0 0 34 34"><path d="M4 30 V16 l7 -5 v5 l7 -5 v5 l7 -5 v19z" fill="#3d5d85"/><rect x="26" y="6" width="4" height="24" fill="#3d5d85"/></svg>',
  stock: '<svg width="34" height="34" viewBox="0 0 34 34"><path d="M5 14 L17 6 L29 14 V30 H5z" fill="#7d91aa"/><rect x="10" y="20" width="14" height="4" fill="#fff"/><rect x="10" y="25" width="14" height="4" fill="#fff"/></svg>',
  house: '<svg width="34" height="34" viewBox="0 0 34 34"><path d="M4 16 L17 5 L30 16" stroke="#c46a3c" stroke-width="3" fill="none"/><rect x="8" y="15" width="18" height="15" fill="#e0a07a"/><rect x="15" y="21" width="5" height="9" fill="#fff"/></svg>'
};

// ===== 렌더 =====
const fmt = (v) => v.toLocaleString('en-US', { maximumFractionDigits: 2 });
const sign = (n) => (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(n).toFixed(2) + '%';
const cls = (n) => (n > 0 ? 'up' : n < 0 ? 'down' : 'flat');
function spark(arr, color) {
  const lo = Math.min(...arr), hi = Math.max(...arr), w = 100, h = 22;
  const pts = arr.map((v, i) => `${(i / (arr.length - 1) * w).toFixed(1)},${(h - (v - lo) / (hi - lo || 1) * h + 1).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 100 24" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`;
}

const d = new Date(R.date + 'T00:00:00');
const dayNo = Math.floor(d.getTime() / 86400000);
const MON = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
const WD = ['일','월','화','수','목','금','토'];
document.getElementById('no').textContent = 'NO.' + (dayNo - 20000);
document.getElementById('edate').textContent = `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`;
document.getElementById('heroTitle').innerHTML = R.one_liner.split(', ').join('<br>');
document.getElementById('heroDate').textContent = `${d.getMonth() + 1}.${d.getDate()} ${WD[d.getDay()]}요일`;
document.getElementById('insT').textContent = R.top.title;
document.getElementById('insP').textContent = R.top.outlook;

document.getElementById('tiles').innerHTML = R.tiles.map(t => {
  const c = cls(t.w), col = c === 'up' ? '#d6453d' : '#2f6fdc';
  return `<div class="tile"><div class="k">${t.k}</div><div class="v">${fmt(t.v)}${t.unit ? `<small style="font-size:13px;font-weight:600"> ${t.unit}</small>` : ''}</div>
    <div class="c ${c}">1주 ${sign(t.w)}</div>${t.spark ? spark(t.spark, col) : ''}</div>`;
}).join('');

document.getElementById('bands').innerHTML = R.markets.map(m => {
  const [label, c] = DIR[m.dir], bg = COLORS[m.key];
  return `<a class="band" style="background:linear-gradient(90deg,${bg} 0%,${bg} 55%,${bg}cc 100%)">
    <div class="name"><b>${m.name}</b><span class="chip ${c}">${label}</span></div><div class="bar"></div>
    <div class="msg"><p>${m.headline}</p><span class="arrow">&rarr;</span></div>
    <div class="art">${BAND_ART[m.key]()}</div></a>`;
}).join('');

function renderCards(v) {
  document.getElementById('cards').innerHTML = R.issues.map((it, i) => {
    const [label, c] = EFFECT[it.effect], col = COLORS[it.markets[(i + v) % it.markets.length]];
    return `<a class="card"><div class="thumb"><svg viewBox="0 0 160 90" preserveAspectRatio="xMidYMid slice">${(THUMB[it.category] || THUMB.supply)(col)}</svg>
      <span class="eff ${c}">${label}</span></div><span class="rg">【${it.region}】</span><h3>${it.title}</h3></a>`;
  }).join('');
}

document.getElementById('sig').innerHTML = R.signals.map(s => `<div><div class="ico">${ICON[s.icon]}</div><b>${s.label}</b><div class="sv">${s.v}</div><small>${s.sub}</small></div>`).join('');
document.getElementById('cal').innerHTML += R.schedule.map(s => `<div class="when">${s.when}</div><div class="what">${s.what}</div>`).join('');

let variant = dayNo % 3;
function renderHero() {
  const set = HERO_ART[R.top.category] || HERO_ART.demand;
  document.getElementById('hero').style.background = HERO_BG[variant % HERO_BG.length];
  document.getElementById('heroArt').innerHTML = set[variant % set.length]();
  renderCards(variant);
}
renderHero();
document.getElementById('demo').onclick = () => { variant = (variant + 1) % 3; renderHero(); };
</script>
</body>
